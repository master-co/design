<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library controls</title><style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#ededf0;color:#29292a;font:14px/1.5 Arial,sans-serif}main{max-width:600px;margin:auto}.card{background:#fff;padding:22px;border:1px solid #c4c4ce;border-radius:16px;box-shadow:inset 0 2px 0 white,0 8px 14px #33333318}h1{font-size:24px;font-weight:500;margin:0 0 16px}.number-row{display:flex;gap:10px;align-items:baseline;margin:22px 0}.number{font-size:28px}.controls{display:flex;gap:12px}button{padding:4px 8px;min-height:26px;font:inherit;border:1px solid #c4c4ce;border-radius:8px;background:#fff;cursor:pointer}button:focus{outline:none}button:active{transform:scale(.94)}.viewport{margin-top:20px;overflow:hidden;background:#eee;border-radius:10px;height:130px;padding:10px}.panel{height:110px;background:white;border-radius:8px;padding:16px;transform:translateX(-120%)}.open .panel{animation:enter 350ms ease-out both}.closed .panel{animation:leave 350ms ease-out both}@keyframes enter{from{transform:translateX(-120%)}to{transform:translateX(0)}}@keyframes leave{from{transform:translateX(0)}to{transform:translateX(-120%)}}@media(max-width:400px){body{padding:16px}}</style><main><h1>Interface library</h1><section class="card"><div class="number-row"><span class="number">11:11</span><span>elapsed</span></div><div class="controls"><button id="value" type="button">Next value</button><button id="toggle" type="button" aria-expanded="false" aria-controls="panel">Open details</button></div><div class="viewport"><div id="panel" class="panel">Project brief<br>Layout review</div></div></section></main><script>let tick=0,open=false;document.querySelector('#value').onclick=()=>{document.querySelector('.number').textContent=['11:11','08:08','12:34'][++tick%3]};document.querySelector('#toggle').onclick=e=>{open=!open;document.querySelector('.viewport').className='viewport '+(open?'open':'closed');e.currentTarget.setAttribute('aria-expanded',String(open));e.currentTarget.textContent=open?'Close details':'Open details'};</script></html>
