<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harbor dispatch</title><style>:root{--ink:#124f59;--paper:#f9f5e9;--accent:#f6ba55;--radius:4px}*{box-sizing:border-box}body{margin:0;padding:30px;background:var(--paper);color:var(--ink);font:14px/1.5 system-ui}main{max-width:660px;margin:auto}h1{font:30px Georgia,serif;margin:0 0 24px}.card{padding:18px;border:2px solid #41717a;border-radius:var(--radius);background:#eee9da;box-shadow:inset 0 3px 0 white,0 8px 9px #124f5930}.label{font-size:11px;letter-spacing:.05em}h2{font:24px Georgia,serif;margin:5px 0}.row{display:flex;align-items:center;justify-content:space-between;margin:8px 0}.actions{display:flex;margin-top:16px}button{font:inherit;cursor:pointer;color:var(--ink);background:var(--paper);padding:8px 12px;border:2px solid #41717a;border-radius:4px}button+button{margin-left:0}button[aria-pressed=true]{background:var(--accent)}button:active{transform:scale(.9)}.meta{display:flex;gap:6px;margin-top:24px}.meta span{padding:5px;background:#eee9da}button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}@media(max-width:440px){body{padding:16px}.meta{flex-wrap:wrap}}</style><main><h1>Harbor dispatch</h1><section class="card"><span class="label">TODAY'S ROUTE</span><h2>North quay</h2><div class="row"><span>Dispatch window</span><strong>08:30–10:00</strong></div><div class="row"><span>Parcels ready</span><strong>18</strong></div><div class="actions" aria-label="Dispatch view"><button type="button" aria-pressed="true">Ready</button><button type="button" aria-pressed="false">In transit</button></div></section><div class="meta"><span>Last check 08:12</span><span>3 routes</span><span>Local workspace</span></div></main><script>document.querySelectorAll('.actions button').forEach(b=>b.addEventListener('click',()=>document.querySelectorAll('.actions button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))));</script></html>
