name: Deploy Design website
# The website has its own lifecycle. Publishing a skill version is not a prerequisite: every push to
# main that passes check.yml delivers the site through the pages-stable Git ref, which Cloudflare Pages
# builds with scripts/build-site-hosted.sh. See docs/site-deployment.md.
on:
  push:
    branches: [main]
  # Reruns the delivery for the head of main, such as after an interrupted run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-site-production
  # Never cancel a delivery halfway; the next push waits and then fast-forwards pages-stable past it.
  cancel-in-progress: false

jobs:
  validation:
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/check.yml

  deploy-site:
    needs: validation
    runs-on: ubuntu-latest
    # Includes the wait for the Cloudflare Pages build of pages-stable and for design.master.co to serve it.
    timeout-minutes: 75
    permissions:
      contents: write # publish the site manifest tag and move pages-stable
      checks: read # read the Cloudflare Pages check of the delivered commit
    # Cloudflare Pages builds pages-stable with its Git integration; this job holds no Cloudflare
    # credential and uploads nothing to Cloudflare.
    env:
      PUBLIC_URL: https://design.master.co
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      PAGES_SUBDOMAIN: ${{ vars.CLOUDFLARE_PAGES_SUBDOMAIN }}
      PAGES_RELEASE_MODE: ${{ vars.CLOUDFLARE_PAGES_MODE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Plan the site delivery for this push
        id: plan
        run: node scripts/pages-site-release.mjs plan
      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.plan.outputs.deliver == 'true' }}
        with:
          bun-version: 1.4.4
      - name: Install the locked dependencies
        if: ${{ steps.plan.outputs.deliver == 'true' }}
        run: bun install --frozen-lockfile
      - name: Verify the exact first-party package pins
        if: ${{ steps.plan.outputs.deliver == 'true' }}
        run: bun run check:site-pins
      - name: Download the output the validation job tested
        if: ${{ steps.plan.outputs.deliver == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: master-design-site-${{ github.sha }}
          path: release-artifacts/tested-site
      # Cloudflare must reproduce these bytes; rebuilding here proves it before anything is published.
      - name: Rebuild the exact site revision and write its identity
        if: ${{ steps.plan.outputs.deliver == 'true' }}
        run: |
          bun run build:site
          node scripts/pages-site-release.mjs identity release-artifacts/tested-site
      - name: Create the output manifest
        if: ${{ steps.plan.outputs.deliver == 'true' }}
        run: node scripts/pages-site-release.mjs manifest
      - name: Retain the verified site output
        if: ${{ steps.plan.outputs.deliver == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: site-delivery-output-${{ github.sha }}
          path: |
            site/out/
            release-artifacts/site.manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Publish the manifest, advance pages-stable and wait for the deployment
        if: ${{ steps.plan.outputs.deliver == 'true' }}
        run: node scripts/pages-site-release.mjs deliver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Retain the delivery receipt
        if: ${{ always() && steps.plan.outputs.deliver == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: site-delivery-${{ github.sha }}-${{ github.run_attempt }}
          path: release-artifacts/site-delivery.json
          if-no-files-found: warn
          retention-days: 90
