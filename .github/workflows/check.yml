name: Check
on:
  pull_request:
  # main is checked by the independent skill-release and website-deployment workflows.
  push:
    branches-ignore: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check:site-pins
      - run: bun run build
      - run: bun run check
      - run: bun run test:install
      - run: bun run check:site
      - run: bun run build:site
      - run: bunx playwright install --with-deps chromium webkit
      - run: bun run test:site
      - run: bun run test:avatars
      - run: bun run test:typography
      - run: bun run test:reading
      - run: bun run test:dashboard
      - run: bun run test:browser
      - run: bun run test:native
      - uses: actions/upload-artifact@v4
        with:
          name: master-design-site-${{ github.sha }}
          path: site/out
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-craft-verification
          path: artifacts/
